<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WZFS Certificates</title>
<style>
  /* WZFS certificate house style (from the library's Canva templates). Fonts are ones Windows
     already has, so nothing is downloaded and it works the same in China. */
  :root { --navy: #17233B; --blue: #1456C0; --gold: #D9A21B; --gold-dark: #6B4A00; --green: #6DB33F; --green-dark: #2F6B1A; --chev: #DCE5F4; --chev2: #C5D4EE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e7e1; font-family: "Segoe UI", Arial, sans-serif; color: #222; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; background: var(--navy); color: #fff; font-size: 14px; }
  .bar b { font-size: 16px; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  .bar input, .bar select { padding: 4px 6px; font: inherit; border-radius: 4px; border: 0; }
  .bar input[type=text] { width: 110px; }
  .bar button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 14px; cursor: pointer; }
  .bar button.plain { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); font-weight: 400; }
  .bar .hint { font-size: 12px; opacity: .85; flex-basis: 100%; line-height: 1.5; }
  .empty { max-width: 560px; margin: 60px auto; padding: 24px; background: #fff; border-radius: 8px; line-height: 1.6; }

  /* One A4 portrait page */
  .cert { position: relative; width: 210mm; height: 297mm; margin: 16px auto; background: #fff; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15); text-align: center; }
  .chev { position: absolute; width: 46mm; height: 74mm; }
  .chev.tr { top: -6mm; right: -10mm; }
  .chev.bl { bottom: 10mm; left: -10mm; transform: scaleX(-1); }
  .head { position: absolute; top: 11mm; left: 0; right: 0; display: flex; gap: 5mm; justify-content: center; align-items: center; }
  .head img { width: 24mm; height: 24mm; object-fit: contain; }
  .head .school { font-family: Georgia, serif; font-weight: 700; font-size: 19pt; color: var(--navy); text-align: center; }
  .head .city { font-size: 13pt; color: #333; margin-top: 1mm; }
  .main { position: absolute; top: 42mm; bottom: 74mm; left: 16mm; right: 16mm; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3.2mm; }
  .this, .intro, .lead, .after, .term, .conferred { font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif; font-size: 13pt; line-height: 1.45; }
  .intro, .lead { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5pt; }
  .orn { width: 128mm; height: 4mm; }
  .certword { font-family: "Segoe UI Black", "Arial Black", sans-serif; font-weight: 900; color: var(--blue); font-size: 40pt; letter-spacing: 4pt; line-height: 1; }
  .of { font-family: "Monotype Corsiva", "Segoe Script", cursive; font-style: italic; color: var(--gold); font-size: 17pt; line-height: .7; }
  .typeword { font-family: "Bahnschrift Condensed", "Bahnschrift", Impact, sans-serif; font-weight: 700; color: var(--gold); font-size: 36pt; letter-spacing: 9pt; line-height: 1; text-transform: uppercase;
    -webkit-text-stroke: .5pt var(--gold-dark); text-shadow: 1px 1px 0 var(--gold-dark); padding-left: 9pt; }
  .name { font-family: "Bahnschrift Condensed", "Bahnschrift", Impact, "Arial Narrow", sans-serif; font-weight: 700; color: #111; font-size: 32pt; line-height: 1.1; text-transform: uppercase; letter-spacing: .6pt; margin: 1mm 0; }
  .name .called { text-transform: none; }
  .award { font-family: "Segoe UI Black", "Arial Black", sans-serif; font-weight: 900; color: var(--gold); font-size: 27pt; line-height: 1.1; text-transform: uppercase; letter-spacing: .5pt;
    text-shadow: 1.5px 1.5px 0 var(--gold-dark); max-width: 172mm; }
  .award.blue { color: var(--blue); text-shadow: 1.5px 1.5px 0 var(--navy); }
  .level { font-family: "Segoe UI Black", "Arial Black", sans-serif; font-weight: 900; color: var(--gold); font-size: 25pt; line-height: 1; text-transform: uppercase; text-shadow: 1.5px 1.5px 0 var(--gold-dark); }
  .level.green { color: var(--green); text-shadow: 1.5px 1.5px 0 var(--green-dark); font-size: 30pt; }
  .gap { height: 2mm; }
  .signs { position: absolute; left: 18mm; right: 18mm; top: 226mm; display: flex; justify-content: space-between; }
  .sign { width: 64mm; }
  .sign .sig { height: 16mm; display: flex; align-items: flex-end; justify-content: center; }
  .sign .sig img { max-height: 16mm; max-width: 50mm; }
  .sign .who { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 11.5pt; text-transform: uppercase; }
  .sign .role { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5pt; color: #333; }
  .accr { position: absolute; left: 0; right: 0; top: 248mm; display: flex; flex-direction: column; align-items: center; gap: 1mm; font-size: 8pt; font-style: italic; color: #444; }
  .accr img { width: 19mm; height: 19mm; }

  /* Green Cards variant */
  .cert.green .chev { display: none; }
  .cert.green .tri { position: absolute; }
  .cert.green .certword { color: var(--navy); font-family: Georgia, serif; font-weight: 400; font-size: 44pt; letter-spacing: 3pt; }
  .cert.green .banner { background: var(--green); color: #fff; font-family: "Segoe UI", Arial, sans-serif; font-size: 25pt; padding: 1mm 14mm; clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
  .cert.green .signs { left: 12mm; right: 66mm; }
  .cert.green .accr img { background: #fff; border-radius: 50%; }
  .cert.green .name { font-family: "Segoe UI", Arial, sans-serif; font-size: 22pt; border-bottom: .8pt solid var(--green); padding-bottom: 3mm; min-width: 110mm; }

  /* Landscape graduation awards (Principal's, Chairman's, Parents' Association …) */
  .cert.land { width: 297mm; height: 210mm; page: land; }
  .cert.land .chev { display: none; }
  .cert.land .script { font-family: "Edwardian Script ITC", "Monotype Corsiva", "Segoe Script", cursive; font-size: 40pt; color: #111; line-height: 1.15;
    border-bottom: .9pt solid var(--gold); padding: 0 10mm 1mm; min-width: 150mm; }
  .cert.land .kicker { font-family: Georgia, serif; text-transform: uppercase; letter-spacing: 2pt; color: var(--blue); font-size: 13pt; margin-top: 2mm; }
  .cert.land .ptitle { font-family: Georgia, "Times New Roman", serif; text-transform: uppercase; color: var(--navy); letter-spacing: 1.5pt; line-height: 1.1; }
  .cert.land .signs .sign { width: 60mm; }
  @page land { size: A4 landscape; margin: 0; }

  [contenteditable]:hover { outline: 1px dashed #8aa3c8; }
  [contenteditable]:focus { outline: 1px solid var(--blue); background: #fffbe6; }
  .edited::after { content: ""; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .bar, .empty { display: none; }
    .cert { margin: 0; box-shadow: none; break-after: page; }
    [contenteditable]:hover, [contenteditable]:focus { outline: none; background: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <b id="count">Certificates</b>
  <label>Semester <select id="semester"><option>Fall</option><option>Spring</option></select></label>
  <label>School year <input type="text" id="year"></label>
  <label>Conferred on <input type="date" id="conferred"></label>
  <button id="print">🖨 Print / Save as PDF</button>
  <button class="plain" id="reset">Undo my edits</button>
  <span class="hint">Proofread each certificate: click any text to correct it. Your edits stay in this browser only (nothing is saved to SharePoint).
    To keep a copy, choose <b>Save as PDF</b> in the print window. Print on A4 with Margins: <b>None</b> and <b>Background graphics</b> on.</span>
</div>
<div id="certs"></div>
<script src="certificates.js"></script>
</body>
</html>
