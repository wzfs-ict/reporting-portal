<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WZFS Certificates</title>
<style>
  /* WZFS certificate design system v2 (designer preset "wzfs-certificate-style-preset", Nov 2026).
     Fonts are bundled in cert/fonts/ so nothing is downloaded and it prints the same in China.
     Flat print typography: no shadows, no outlines, no gradients on text. */
  @font-face { font-family: "EB Garamond"; src: url("cert/fonts/eb-garamond-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "EB Garamond"; src: url("cert/fonts/eb-garamond-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "EB Garamond"; src: url("cert/fonts/eb-garamond-600.woff2") format("woff2"); font-weight: 600; font-style: normal; }
  @font-face { font-family: "EB Garamond"; src: url("cert/fonts/eb-garamond-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Arizonia"; src: url("cert/fonts/arizonia.ttf") format("truetype"); font-weight: 400; font-style: normal; }

  :root {
    --paper: #FAF5EA;      /* ivory on every certificate, never white */
    --navy: #17233B;       /* all main text + frames */
    --gold: #C9A227;       /* antique gold accent (frames, rules, medallion) */
    --darkGold: #6B4A00;   /* small text only (location, roles, captions, T1 titles) */
    --greenDark: #2F6B1A;  /* Tier 3 wordmark/title/rules only */
    --greenLight: #6DB33F; /* Tier 3 accents only */
    --medalBg: #F3E9CF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e7e1; font-family: "Segoe UI", Arial, sans-serif; color: #222; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; background: var(--navy); color: #fff; font-size: 14px; }
  .bar b { font-size: 16px; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  .bar input, .bar select { padding: 4px 6px; font: inherit; border-radius: 4px; border: 0; }
  .bar input[type=text] { width: 110px; }
  .bar button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 14px; cursor: pointer; }
  .bar button.plain { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); font-weight: 400; }
  .bar .hint { font-size: 12px; opacity: .85; flex-basis: 100%; line-height: 1.5; }
  .empty { max-width: 560px; margin: 60px auto; padding: 24px; background: #fff; border-radius: 8px; line-height: 1.6; }

  /* One A4 portrait page */
  .cert { position: relative; width: 210mm; height: 297mm; margin: 16px auto; background: var(--paper); overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); text-align: center; font-family: "EB Garamond", Georgia, serif;
    print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .cert.land { width: 297mm; height: 210mm; page: land; }

  /* Frame: navy outer @ inset 7mm; gold inner @ inset 10mm; gold corner diamonds */
  .frame-o { position: absolute; inset: 7mm; border: 0.7mm solid var(--navy); pointer-events: none; }
  .frame-i { position: absolute; inset: 10mm; border: 0.3mm solid var(--gold); pointer-events: none; }
  .dia { position: absolute; width: 2.6mm; height: 2.6mm; background: var(--gold); transform: rotate(45deg); pointer-events: none; }
  .dia.tl { top: 8.7mm; left: 8.7mm; } .dia.tr { top: 8.7mm; right: 8.7mm; }
  .dia.bl { bottom: 8.7mm; left: 8.7mm; } .dia.br { bottom: 8.7mm; right: 8.7mm; }

  /* Header: crest, school name, city — all on the one center axis */
  .head { position: absolute; top: 13mm; left: 0; right: 0; text-align: center; }
  .head img { width: 20mm; height: 20mm; object-fit: contain; mix-blend-mode: multiply; }
  .head .school { font-weight: 700; font-size: 19pt; color: var(--navy); margin-top: 1.5mm; }
  .head .city { font-size: 10.5pt; color: var(--darkGold); font-style: italic; margin-top: 0.5mm; }

  /* Content stack, centered between header and signatures */
  .main { position: absolute; top: 60mm; bottom: 58mm; left: 14mm; right: 14mm;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2.6mm; }
  .wm { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 88mm; opacity: 0.07; pointer-events: none; }

  .certword { font-weight: 700; color: var(--navy); font-size: 25pt; letter-spacing: 4pt; line-height: 1; padding-left: 4pt; }
  .t1 .certword { font-size: 29pt; }
  .t3 .certword { color: var(--greenDark); }
  .ofline { font-weight: 600; font-size: 12.5pt; letter-spacing: 4.5pt; text-transform: uppercase; color: var(--gold); padding-left: 4.5pt; }
  .t2 .ofline { color: var(--navy); }
  .t3 .ofline { color: var(--greenDark); }

  .rule { width: 62mm; height: 4mm; }
  .nrule { width: 72mm; height: 3.5mm; }

  /* Tier 1 medallion */
  .medal { width: 16.5mm; height: 16.5mm; border-radius: 50%; background: var(--medalBg);
    border: 0.6mm solid var(--gold); display: flex; align-items: center; justify-content: center; }
  .medal svg { width: 8mm; height: 8mm; fill: var(--gold); }
  .medal.navy { border-color: var(--navy); }
  .medal.navy svg { fill: var(--navy); }
  .medal.book svg { fill: var(--navy); }

  .intro, .lead, .after { font-size: 12.5pt; line-height: 1.4; color: var(--navy); }
  .name { font-weight: 700; color: var(--navy); line-height: 1.12; }
  .name .called { font-style: italic; font-weight: 400; }
  .title { font-weight: 700; text-transform: uppercase; line-height: 1.15; max-width: 160mm; letter-spacing: 0.8pt; }
  .t1 .title { color: var(--darkGold); }
  .t1 .title.navy { color: var(--navy); }
  .t2 .title { color: var(--navy); }
  .t3 .title { color: var(--greenDark); }

  /* Placement / level: metallic pill where there is one, otherwise a small-caps line */
  .pill { display: inline-block; padding: 1.2mm 9mm; border-radius: 999px; font-weight: 700; font-size: 12.5pt;
    text-transform: uppercase; letter-spacing: 1.6pt; color: var(--navy); border: 0.2mm solid rgba(23,35,59,.35); }
  .pill.gold { background: linear-gradient(135deg, #F0D67C, #C9A227 55%, #A58416); }
  .pill.silver { background: linear-gradient(135deg, #F4F4F6, #C9CAD0 55%, #A6A8B0); }
  .pill.bronze { background: linear-gradient(135deg, #E8B083, #B0703C 55%, #8A5326); }
  .pill.platinum { background: linear-gradient(135deg, #FFFFFF, #D9DADE 55%, #B9BBC4); }
  .level { font-weight: 600; font-size: 12.5pt; letter-spacing: 2.5pt; text-transform: uppercase; color: var(--darkGold); }
  .t3 .level { color: var(--greenDark); }

  .term, .conferred { font-size: 11.5pt; color: var(--navy); }
  .conferred { font-style: italic; color: var(--darkGold); }
  .gap { height: 1.5mm; }

  /* Signatures: left/right share one baseline; WASC seal exactly centered between them */
  .signs { position: absolute; left: 16mm; right: 16mm; top: 238mm; display: flex; justify-content: space-between; align-items: flex-end; }
  .sign { width: 62mm; text-align: center; }
  .sign .sig { height: 14mm; display: flex; align-items: flex-end; justify-content: center; }
  .sign .sig img { max-height: 14mm; max-width: 48mm; mix-blend-mode: multiply; }
  .sign .sigline { border-top: 0.35mm solid var(--navy); margin: 1mm 5mm 1.6mm; }
  .sign .who { font-weight: 700; font-size: 11.5pt; text-transform: uppercase; color: var(--navy); }
  .sign .role { font-size: 10pt; color: var(--darkGold); font-style: italic; }
  .wasc { width: 42mm; text-align: center; padding-bottom: 1mm; }
  .wasc .cap { font-size: 8pt; font-style: italic; color: var(--darkGold); }
  .wasc img { width: 18mm; height: 18mm; object-fit: contain; mix-blend-mode: multiply; margin: 0.6mm 0; }

  /* Tier 4 landscape graduation awards */
  .land .head { top: 12mm; }
  .land .main { top: 48mm; bottom: 48mm; left: 30mm; right: 30mm; gap: 2.4mm; }
  .land .wm { width: 70mm; }
  .land .kicker { font-weight: 600; font-size: 12pt; letter-spacing: 3.5pt; text-transform: uppercase; color: var(--navy); }
  .land .script { font-family: "Arizonia", "Monotype Corsiva", "Segoe Script", cursive; font-size: 45pt; color: var(--navy); line-height: 1.15; }
  .land .ptitle { font-weight: 700; text-transform: uppercase; color: var(--navy); letter-spacing: 1.5pt; line-height: 1.15; max-width: 220mm; }
  .land .signs { top: 160mm; left: 28mm; right: 28mm; }
  .land .term, .land .conferred { font-size: 11pt; }

  [contenteditable]:hover { outline: 1px dashed #8aa3c8; }
  [contenteditable]:focus { outline: 1px solid var(--navy); background: #fffbe6; }

  @page { size: A4 portrait; margin: 0; }
  @page land { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    .bar, .empty { display: none; }
    .cert { margin: 0; box-shadow: none; break-after: page; }
    [contenteditable]:hover, [contenteditable]:focus { outline: none; background: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <b id="count">Certificates</b>
  <label>Semester <select id="semester"><option>Fall</option><option>Spring</option></select></label>
  <label>School year <input type="text" id="year"></label>
  <label>Conferred on <input type="date" id="conferred"></label>
  <button id="print">🖨 Print / Save as PDF</button>
  <button class="plain" id="reset">Undo my edits</button>
  <span class="hint">Proofread each certificate: click any text to correct it. Your edits stay in this browser only (nothing is saved to SharePoint).
    To keep a copy, choose <b>Save as PDF</b> in the print window. Print on A4 with Margins: <b>None</b> and <b>Background graphics</b> on.</span>
</div>
<div id="certs"></div>
<script src="certificates.js"></script>
</body>
</html>
